<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drexie Jaira Litaoen — The Desk</title>
<script>{const p=new URLSearchParams(location.search).get("palette");if(p)document.documentElement.dataset.palette=p}</script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>
<canvas id="c" aria-label="Interactive 3D desk. Click an object to explore."></canvas>

<header id="intro" class="ui"><div class="eb">The Desk</div><h1></h1><p class="tag"></p></header>
<!-- School ID: transparent overlay canvas (right side). js/idcard.js draws the card + lanyard into it and handles the drag. -->
<figure id="portrait" class="ui" aria-label="School ID on a lanyard. Drag the card or the strap to pull it."><canvas></canvas></figure>
<button id="hback" class="btn ui" type="button" inert>← Desk</button>
<div id="bnav" class="ui" inert>
  <button class="btn" id="pv" type="button" aria-label="Scroll up">↑</button>
  <span id="pg"></span>
  <button class="btn" id="nx" type="button" aria-label="Scroll down">↓</button>
</div>
<aside id="panel" class="ui" role="dialog" aria-live="polite" inert></aside>
<nav id="chips" class="ui" aria-label="Desk objects"></nav>
<div id="tip"></div>

<!-- three r128 exposes a global; js/scene/three.js is the single place that touches it -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
